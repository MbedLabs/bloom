server {
    listen 8080;
    server_name _;
    root /var/www/app;
    index index.html;

    # Cap request bodies globally so an unauthenticated flood can't stream large
    # payloads into the app. The ReqIF import route raises its own ceiling below.
    # (nginx's built-in default is only 1m, which silently 413s ReqIF imports —
    # the headline "bring your DOORS/Polarion data in" feature.)
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: no inline scripts (Vite emits external bundles only). connect-src keeps
    # https: because the Bloom UI calls the Bud API cross-origin at a runtime-
    # configured URL (window.runtimeConfig.BUD_APP_URL) — pin it to your Bud origin
    # per deployment if you want it tighter. Plaintext http: is no longer allowed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self';" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ReqIF import accepts files up to the app's fixed 25 MiB streamed limit.
    # 26m leaves headroom for multipart/form-data overhead so nginx never rejects
    # a request the application itself would accept. A regex location is required
    # because of the dynamic {project_id} segment; regex matches take precedence
    # over the /api prefix below, so import requests are routed here.
    location ~ ^/api/projects/[^/]+/import {
        client_max_body_size 26m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed build output only: immutable long cache is safe because Vite renames
    # these files on every content change.
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Brand wordmarks: never cache — logo swaps must show immediately
    location ~* ^/(bloombg|bloomnobg|bloomicon|budnobg|budbg|budicon)\.png$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Other static images / favicons: short cache so updates are not stuck for a year
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}

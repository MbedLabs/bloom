  build-image:
    if: github.event_name == 'push'
    name: Build Product Image
    runs-on: ubuntu-latest
    needs: validate
    concurrency:
      group: build-product-${{ github.sha }}
      cancel-in-progress: false

    permissions:
      contents: write
      packages: write

    outputs:
      image: ${{ steps.sha-image.outputs.image }}
      aliases: ${{ steps.aliases.outputs.list }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            echo "Expected vMAJOR.MINOR.PATCH with optional SemVer prerelease or build metadata." >&2
            exit 1
          fi

          VERSION_WITHOUT_BUILD=${RELEASE_TAG%%+*}
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version consistency gate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          base="${RELEASE_TAG#v}"; base="${base%%-*}"; base="${base%%+*}"
          gate_fail() { echo "::error::version gate: $*"; exit 1; }
          check() { [ "$2" = "$base" ] || gate_fail "$1 is '$2' but the tag is '$base'"; }
          check "pyproject.toml version" \
            "$(sed -nE 's/^version = "([^"]+)".*/\1/p' pyproject.toml | head -1)"
          check "ui/package.json version" \
            "$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' ui/package.json | head -1)"
          check "app/__init__.py __version__" \
            "$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' app/__init__.py | head -1)"
          check "BLOOM_APP_VERSION (/api/version)" \
            "$(sed -nE 's/.*BLOOM_APP_VERSION[^"]*"([^"]+)".*/\1/p' app/core/config.py | head -1)"
          check "Cloudron package version" "$(python -c 'import json; print(json.load(open("cloudron/CloudronManifest.json"))["version"])')"
          check "Cloudron upstream version" "$(python -c 'import json; print(json.load(open("cloudron/CloudronManifest.json"))["upstreamVersion"])')"
          esc="${base//./\\.}"
          grep -Eq "(^|[^0-9.])${esc}([^0-9]|\$)" docs/CHANGELOG.md \
            || gate_fail "docs/CHANGELOG.md has no release entry for ${base}"
          echo "Version consistency OK for ${base}"

      - name: Verify the tagged commit is contained in main history
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            git fetch --no-tags --unshallow origin main
          else
            git fetch --no-tags origin main
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "Tagged commit $GITHUB_SHA is contained in main history."
          else
            echo "::error::release tag ${GITHUB_REF_NAME} ($GITHUB_SHA) is not contained in main history" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.release.outputs.stable == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.release.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ steps.release.outputs.stable == 'true' }}
            type=sha,prefix=sha-

      - name: Extract the immutable sha-only tag
        id: metasha
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=false
          tags: type=sha,prefix=sha-

      - name: Reuse an existing commit image
        id: existing
        env:
          SHA_TAGS: ${{ steps.metasha.outputs.tags }}
        run: python3 scripts/image_release.py existing "$SHA_TAGS"

      - name: Build and push the immutable sha image
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: ${{ steps.metasha.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Resolve tested image by digest
        id: sha-image
        env:
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Compute moving alias tags
        id: aliases
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          aliases="$(printf '%s\n' "$ALL_TAGS" | grep -v ':sha-' || true)"
          {
            echo "list<<ALIAS_EOF"
            printf '%s\n' "$aliases"
            echo "ALIAS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Moving aliases to promote after e2e:"
          printf '%s\n' "$aliases"

      - name: Verify published image startup contract
        env:
          IMAGE: ${{ steps.sha-image.outputs.image }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE"
          docker run --rm --platform linux/amd64 --entrypoint /bin/sh "$IMAGE" -c '
            set -eu
            test "$(stat -c %a /usr/local/bin/start-product)" = "755"
            test "$(stat -c %a /etc/supervisord.conf)" = "644"
            test "$(stat -Lc %a /etc/nginx/sites-enabled/default)" = "644"
            test -r /usr/local/bin/start-product
            test -x /usr/local/bin/start-product
            test -r /etc/supervisord.conf
            test -r /etc/nginx/sites-enabled/default
            /bin/sh -n /usr/local/bin/start-product
            /usr/sbin/nginx -t
            set +e
            timeout 5 /bin/sh /usr/local/bin/start-product >/tmp/startup.log 2>&1
            status=$?
            set -e
            cat /tmp/startup.log
            test "$status" = "124"
          '

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ steps.sha-image.outputs.image }}
          format: spdx-json
          artifact-name: bloom-sbom.spdx.json

  e2e-image:
    if: github.event_name == 'push'
    name: End-to-end (published image)
    runs-on: ubuntu-latest
    needs: build-image

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published image
        run: docker pull --platform linux/amd64 "${{ needs.build-image.outputs.image }}"

      - name: End-to-end smoke test
        run: bash scripts/e2e_image_smoke.sh "${{ needs.build-image.outputs.image }}"

      - name: Cloudron compatibility smoke test (normal image)
        run: bash scripts/cloudron_image_smoke.sh "${{ needs.build-image.outputs.image }}" bloom

  promote-image:
    if: github.event_name == 'push'
    name: Promote moving tags
    runs-on: ubuntu-latest
    needs: [build-image, e2e-image]
    concurrency:
      group: promote-product-images
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the tested image to its moving aliases
        env:
          SHA_IMAGE: ${{ needs.build-image.outputs.image }}
          ALIASES: ${{ needs.build-image.outputs.aliases }}
        run: python3 scripts/image_release.py promote

name: Bloom Product CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  DOCKER_METADATA_SHORT_SHA_LENGTH: 40

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    env:
      BLOOM_DOTENV_DISABLED: "1"

    services:
      mailpit:
        image: axllent/mailpit@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
        ports:
          - 11025:1025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_bloom
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install backend dependencies
        run: |
          uv lock --check --no-build
          uv sync --frozen --no-build --no-install-project --extra dev --group ci
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install UI dependencies
        run: npm --prefix ui ci --ignore-scripts

      - name: Audit UI dependencies
        run: npm --prefix ui run audit

      - name: Check backend formatting with Black
        run: black --check --diff app/ tests/

      - name: Check backend imports with isort
        run: isort --profile black --check-only --diff app/ tests/

      - name: Run backend security scans
        run: |
          bandit -r app/ -ll
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          pip-audit -r "$RUNNER_TEMP/runtime-requirements.txt" --require-hashes --disable-pip

      - name: Alembic upgrade on an empty database
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:15432/test_bloom
          SECRET_KEY: test-secret-key-for-ci-at-least-32-characters-long
          BLOOM_DOTENV_DISABLED: "1"
        run: |
          alembic upgrade head
          alembic current
          alembic current | grep -q "(head)" || { echo "database is not at alembic head" >&2; exit 1; }

      - name: Alembic downgrade and re-upgrade (deployed-database path)
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:15432/test_bloom
          SECRET_KEY: test-secret-key-for-ci-at-least-32-characters-long
          BLOOM_DOTENV_DISABLED: "1"
        run: |
          alembic downgrade -1
          alembic upgrade head
          alembic current | grep -q "(head)" || { echo "database is not at alembic head" >&2; exit 1; }

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:15432/test_bloom
          SECRET_KEY: test-secret-key-for-ci-at-least-32-characters-long
          SERVICE_TOKEN_PEPPER: test-service-token-pepper-for-ci-at-least-32-characters-long
          ENABLE_DOCS: "false"
          BLOOM_DOTENV_DISABLED: "1"
          BLOOM_DISABLE_RATE_LIMIT: "1"
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=78 tests/api tests/logic tests/sec -v

      - name: Postgres tests
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:15432/test_bloom
          SECRET_KEY: test-secret-key-for-ci-at-least-32-characters-long
          SERVICE_TOKEN_PEPPER: test-service-token-pepper-for-ci-at-least-32-characters-long
          ENABLE_DOCS: "false"
          BLOOM_DOTENV_DISABLED: "1"
          BLOOM_DISABLE_RATE_LIMIT: "1"
        run: |
          pytest tests/pg -v

      - name: Postgres tests again on the same database
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:15432/test_bloom
          SECRET_KEY: test-secret-key-for-ci-at-least-32-characters-long
          SERVICE_TOKEN_PEPPER: test-service-token-pepper-for-ci-at-least-32-characters-long
          ENABLE_DOCS: "false"
          BLOOM_DOTENV_DISABLED: "1"
          BLOOM_DISABLE_RATE_LIMIT: "1"
        run: |
          pytest tests/pg -q

      - name: BudTestCase suite baselines_http
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:15432/test_bloom
          SECRET_KEY: test-secret-key-for-ci-at-least-32-characters-long
          SERVICE_TOKEN_PEPPER: test-service-token-pepper-for-ci-at-least-32-characters-long
          ENABLE_DOCS: "false"
          BLOOM_DOTENV_DISABLED: "1"
          BLOOM_DISABLE_RATE_LIMIT: "1"
          BUDTEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:15432/test_bloom
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "from tests.budtests.baselines_http import BaselinesHttp; raise SystemExit(0 if BaselinesHttp().run() else 1)"

      - name: Generate the integration encryption key
        run: |
          echo "INTEGRATION_ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")" >> "$GITHUB_ENV"

